<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="60%" stop-color="#090a10" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  
  <!-- Outer Tunnel Ring -->
  <polygon points="256,40 472,164 472,348 256,472 40,348 40,164" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.4" filter="url(#glow)" />
  
  <!-- Mid Tunnel Ring -->
  <polygon points="256,90 422,185 422,327 256,422 90,327 90,185" fill="none" stroke="#7000ff" stroke-width="8" opacity="0.7" filter="url(#glow)" />

  <!-- Inner Tunnel Ring -->
  <polygon points="256,140 372,207 372,305 256,372 140,305 140,207" fill="none" stroke="#ff007f" stroke-width="10" filter="url(#glow)" />

  <!-- Perspective Lines -->
  <line x1="40" y1="40" x2="256" y2="256" stroke="#00f0ff" stroke-width="2" opacity="0.3" stroke-dasharray="8 8" />
  <line x1="472" y1="40" x2="256" y2="256" stroke="#00f0ff" stroke-width="2" opacity="0.3" stroke-dasharray="8 8" />
  <line x1="472" y1="472" x2="256" y2="256" stroke="#00f0ff" stroke-width="2" opacity="0.3" stroke-dasharray="8 8" />
  <line x1="40" y1="472" x2="256" y2="256" stroke="#00f0ff" stroke-width="2" opacity="0.3" stroke-dasharray="8 8" />

  <!-- Center Core Energy -->
  <circle cx="256" cy="256" r="45" fill="#00f0ff" opacity="0.2" filter="url(#glow)" />
  <circle cx="256" cy="256" r="25" fill="#ffffff" filter="url(#glow)" />

  <!-- Stylized 'T' Symbol in Center -->
  <path d="M 216 220 L 296 220 M 256 220 L 256 292" stroke="#0a0b12" stroke-width="12" stroke-linecap="round" />
</svg>
