<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#003311" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#05080A" stop-opacity="1"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Shield Background -->
  <rect width="500" height="500" rx="32" fill="#0A0E14"/>
  <rect width="500" height="500" rx="32" fill="url(#bgGlow)"/>
  
  <!-- Outer Matrix Border -->
  <rect x="20" y="20" width="460" height="460" rx="20" fill="none" stroke="#00FF66" stroke-width="2" stroke-dasharray="16 8" opacity="0.4"/>
  <rect x="30" y="30" width="440" height="440" rx="14" fill="none" stroke="#00FF66" stroke-width="1.5" opacity="0.2"/>

  <!-- Radar Rings -->
  <circle cx="250" cy="230" r="140" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.25"/>
  <circle cx="250" cy="230" r="95" fill="none" stroke="#00FF66" stroke-width="1.5" opacity="0.35"/>
  <circle cx="250" cy="230" r="50" fill="none" stroke="#00FF66" stroke-width="2" opacity="0.5"/>

  <!-- Glowing WiFi Waves -->
  <!-- Arc 3 (Outer) -->
  <path d="M 140 150 A 155 155 0 0 1 360 150" fill="none" stroke="#00FF66" stroke-width="14" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- Arc 2 (Middle) -->
  <path d="M 175 190 A 105 105 0 0 1 325 190" fill="none" stroke="#00FF66" stroke-width="14" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- Arc 1 (Inner) -->
  <path d="M 210 230 A 55 55 0 0 1 290 230" fill="none" stroke="#00FF66" stroke-width="14" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- Center Signal Dot -->
  <circle cx="250" cy="275" r="14" fill="#00FF66" filter="url(#neonGlow)"/>

  <!-- Security Padlock / Terminal Symbol -->
  <g transform="translate(250, 340)">
    <rect x="-42" y="-12" width="84" height="64" rx="8" fill="#00FF66" opacity="0.15" stroke="#00FF66" stroke-width="2"/>
    <!-- Shackle -->
    <path d="M -24 -12 V -32 C -24 -46 24 -46 24 -32 V -12" fill="none" stroke="#00FF66" stroke-width="4" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="0" cy="14" r="6" fill="#00FF66"/>
    <path d="M -3 18 L -5 32 L 5 32 L 3 18 Z" fill="#00FF66"/>
  </g>

  <!-- Typography / Brand -->
  <text x="250" y="445" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="28" fill="#00FF66" letter-spacing="6" filter="url(#neonGlow)">WIFI_MASTER</text>
  <text x="250" y="475" text-anchor="middle" font-family="'Courier New', monospace" font-weight="600" font-size="13" fill="#00CC55" letter-spacing="3" opacity="0.8">WIRELESS SECURITY SUITE</text>
</svg>
